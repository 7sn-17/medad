name: Build Medad Android Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Package Web Assets and Java Bridges
        run: |
          echo "جاري تجميع حزمة تطبيق مِدَاد أندرويد المتكاملة..."
          mkdir -p release-bundle
          cp -r app/src/main/assets/* release-bundle/
          cp -r app/src/main/java/ release-bundle/java-sources/
          echo "تم تجميع الملفات بنجاح وجاهزة للاستخدام."

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MedadAndroid-Full-Source-Package
          path: release-bundle/
